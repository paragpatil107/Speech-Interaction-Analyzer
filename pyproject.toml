[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-interaction-analyzer"
version = "0.2.0"
description = "Simple local recording and analysis interface for speech interactions."
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper>=1.1.0,<2.0",
  "pyannote.audio>=3.3.2,<4.0",
  "matplotlib>=3.8,<4.0",
  "numpy>=1.26,<3.0",
  "soundfile>=0.12,<1.0",
  "sounddevice>=0.4.6,<1.0",
  "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
speech-analyzer = "speech_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speech_analyzer = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
